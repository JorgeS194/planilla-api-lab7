<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilla de empleados</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header class="encabezado">
        <h1>Planilla de empleados</h1>
    </header>

    <main class="contenedor">
        <!-- Mensajes de éxito o error -->
        <p id="mensaje" class="mensaje" role="alert" hidden></p>

        <!-- Formulario para crear y editar -->
        <section class="tarjeta">
            <h2 id="titulo-formulario">Nuevo empleado</h2>

            <form id="formulario-empleado" class="formulario">
                <label>
                    Cédula
                    <input name="cedula" required maxlength="20">
                </label>

                <label>
                    Nombre
                    <input name="nombre" required maxlength="60">
                </label>
                <label>
                    Apellido
                    <input name="apellido" required maxlength="60">
                </label>
                <label>
                    Cargo
                    <input name="cargo" required maxlength="80">
                </label>

                <label>
                    Fecha de ingreso
                    <input type="date" name="fechaIngreso" required>
                </label>

                <label>
                    Salario base
                    <input type="number" name="salarioBase" required min="0.01" step="0.01">
                </label>

                <label>
                    Departamento
                    <select name="departamentoId" required></select>
                </label>

                <div class="acciones-formulario">
                    <button type="submit" id="boton-guardar" class="boton-primario">Guardar</button>
                    <button type="button" id="boton-cancelar" class="boton-secundario" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Lista de empleados -->
        <section class="tarjeta">
            <h2>Empleados</h2>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Cédula</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Cargo</th>
                            <th>Departamento</th>
                            <th>Ingreso</th>
                            <th class="numero">Salario base</th>
                            <th class="numero">Salario neto</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla"></tbody>
                </table>
            </div>
        </section>

        <!-- Formulario para crear y editar departamentos -->
        <section class="tarjeta">
            <h2 id="titulo-formulario-departamento">Nuevo departamento</h2>

            <form id="formulario-departamento" class="formulario">
                <label>
                    Nombre
                    <input name="nombre" required maxlength="100">
                </label>

                <label>
                    Ubicación
                    <input name="ubicacion" maxlength="100">
                </label>

                <div class="acciones-formulario">
                    <button type="submit" id="boton-guardar-departamento" class="boton-primario">Guardar</button>
                    <button type="button" id="boton-cancelar-departamento" class="boton-secundario" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Lista de departamentos -->
        <section class="tarjeta">
            <h2>Departamentos</h2>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Ubicación</th>
                            <th class="numero">Cantidad de empleados</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla-departamentos"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
